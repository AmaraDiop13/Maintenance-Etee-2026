; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 🚀 Vitesse de communication avec l'ordinateur
monitor_speed = 115200
upload_speed = 921600

; ⚙️ CONFIGURATION INDISPENSABLE POUR LA CARTE WAVESHARE ESP32-S3-ETH
board_build.flash_mode = dio
board_build.f_flash = 80000000L

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 📚 GESTIONNAIRE DE BIBLIOTHÈQUES
; Déclare ici que ton projet a besoin de la bibliothèque Ethernet officielle
lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2